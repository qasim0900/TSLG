# Alembic configuration for the CRM schema.
# Usage: python main.py --crm-migrate     (or TechsetLeadGen.exe --crm-migrate)
#        alembic -c crm/alembic.ini upgrade head
[alembic]
script_location = %(here)s/migrations

path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# Left empty on purpose: the database comes from TSLG_CRM_DATABASE_URL / crm.env via crm.config.
sqlalchemy.url =
