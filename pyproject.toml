[tool.pytest.ini_options]
testpaths = ["tests", "analysis/tests"]
python_files = ["test_*.py"]
markers = [
    "gui: headless Flet control-tree tests (no display required)",
]

[tool.coverage.run]
source = ["."]
omit = [
    ".venv/*",
    "tests/*",
    "analysis/tests/*",
    "scripts/*",
    "conftest.py",
]

[tool.coverage.report]
skip_empty = true

[tool.ruff]
target-version = "py313"
extend-exclude = [".venv", "screenshots"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F811", "F841", "B006", "B008", "B011", "B017", "B018"]

[tool.mypy]
python_version = "3.15"
ignore_missing_imports = true
explicit_package_bases = true
files = ["core", "models", "controllers", "services", "analysis", "domain", "utils", "reports"]
exclude = ["analysis/tests/"]

[tool.bandit]
exclude_dirs = [".venv", "tests", "analysis/tests"]

[project]
name = "tslg"
version = "0.1.0"
description = ""
authors = [
    {name = "qasim0900",email = "qasim_kamran2007@yahoo.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "flet (>=1.0.4,<2.0.0)",
    "flet-desktop (>=1.0.4,<2.0.0)",
    "flet-charts (>=1.0.4,<2.0.0)",
    "polars (>=2.0.0,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "numpy (>=2.5.4,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.17.1,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "bandit (>=1.9.4,<2.0.0)",
    "pip-audit (>=2.10.1,<3.0.0)"
]
