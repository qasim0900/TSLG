[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
markers = [
    "gui: headless Qt widget tests (no display required)",
    "postgres: needs a PostgreSQL server (TSLG_TEST_POSTGRES_URL); skipped otherwise",
]

[tool.coverage.run]
source = ["src/techset_leadgen"]

[tool.coverage.report]
skip_empty = true

[tool.ruff]
target-version = "py312"
extend-exclude = [".venv", "screenshots"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F811", "F841", "B006", "B008", "B011", "B017", "B018"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
mypy_path = "src"
explicit_package_bases = true
files = ["src/techset_leadgen"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]

[tool.poetry]
packages = [{ include = "techset_leadgen", from = "src" }]

[project]
name = "tslg"
version = "0.2.0"
description = "Techset LeadGen: native desktop application for LinkedIn outreach teams (assignments, follow-ups, tasks)."
authors = [
    {name = "qasim0900",email = "qasim_kamran2007@yahoo.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.16"
dependencies = [
    "polars (>=2.0.0,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "pyside6 (>=6.12.0,<7.0.0)",
    # Accounts and record workflows: database access, schema migrations,
    # password hashing (Argon2), and input validation.
    "sqlalchemy (>=2.1.5,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    # The shared team database (PostgreSQL) for multi-computer deployments.
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    # Windows has no system time-zone database; zoneinfo falls back to this package.
    "tzdata (>=2025.2)"
]

[project.gui-scripts]
techset-leadgen = "techset_leadgen.main:main"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.17.1,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "bandit (>=1.9.4,<2.0.0)",
    "pip-audit (>=2.10.1,<3.0.0)",
    # Builds the Windows executable (packaging/TechsetLeadGen.spec).
    "pyinstaller (>=6.22.3,<7.0.0)"
]
